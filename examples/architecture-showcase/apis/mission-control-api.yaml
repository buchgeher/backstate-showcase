openapi: 3.0.3
info:
  title: Delivery Robot Mission Control API
  description: RESTful API for dispatching and supervising autonomous delivery robot missions.
  version: 1.0.0
  contact:
    name: Fleet Architecture Team
    email: fleet-arch@delivery-robot.io
servers:
  - url: http://localhost:8080/api/v1
    description: Local Dev Gateway
paths:
  /missions:
    get:
      summary: List active delivery missions
      operationId: listMissions
      responses:
        '200':
          description: A list of active missions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Mission'
    post:
      summary: Dispatch a robot to a new delivery mission
      operationId: createMission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewMissionRequest'
      responses:
        '202':
          description: Mission accepted and assigned to fleet router
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
        '400':
          description: Invalid mission parameters

  /missions/{missionId}:
    get:
      summary: Get details of a specific mission
      parameters:
        - name: missionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Mission details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
        '404':
          description: Mission not found

components:
  schemas:
    NewMissionRequest:
      type: object
      required:
        - destinationAddress
        - cargoWeightKg
      properties:
        destinationAddress:
          type: string
          example: "Campus Softwarepark 11, Hagenberg"
        cargoWeightKg:
          type: number
          example: 4.5
        priority:
          type: string
          enum: [standard, express, critical]
          default: standard
    Mission:
      type: object
      properties:
        missionId:
          type: string
          example: "mis-9871a"
        assignedRobotId:
          type: string
          example: "robot-alpha-04"
        status:
          type: string
          enum: [queued, in_transit, delivered, abort_safety]
          example: "in_transit"
        etaMinutes:
          type: integer
          example: 12
